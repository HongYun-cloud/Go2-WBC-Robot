# Go2 控制节点 ROS 2 参数
# 用法: ros2 run go2_robot go2_control_node --ros-args --params-file <path>/go2_params.yaml
# 相对路径基于运行目录 (默认从 Go2Robot/build/ 运行, 与原 ../go2 行为一致)
go2_control_node:
  ros__parameters:
    # ===== 后端选择 =====
    robot_backend: "mujoco"        # mujoco | unitree (实机待实现)
    controller_type: "traditional" # traditional (MPC+WBC) | rl (ONNX Policy)

    # ===== 模型/配置文件路径 (相对包根目录, launch 会解析为绝对路径) =====
    mujoco_model: "go2/scene_flat.xml"
    urdf_path:    "go2/go2_description.urdf"
    control_config: "config/control.yaml"  # MPC/WBC 权重 + 任务空间 PD
    policy_path: "model/go2_best.onnx"     # RL 策略 ONNX 模型

    # ===== 频率 (Hz) =====
    control_frequency: 500.0    # 控制主循环; 必须等于 1/mujoco_timestep (0.002), 节点会校验告警
    publish_frequency: 50.0     # odom / joint_states / 足端力 发布

    # ===== 控制参数 =====
    initial_gait: "TROT"        # TROT / WALK / STAND (仅 traditional)
    desired_height: 0.25        # MPC 期望机身高度 (仅 traditional)
    max_cmd_vel: 0.05           # /cmd_vel linear.x 限幅 (原键盘 w/s 为 ±0.05)

    # ===== 触地检测 (仅 traditional, 见 src/fsm/ControlFSM.cpp) =====
    touchdown_force: 5.0        # 落地判定阈值 (N)。整机约 16kg, TROT 下单腿支撑相约 80N
    airborne_hold_ratio: 0.5    # 悬空强制下压的最长时间 = ratio × T_stance